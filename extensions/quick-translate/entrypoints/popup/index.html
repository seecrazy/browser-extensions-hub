<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Translate</title>
  </head>
  <body>
    <main class="qt-shell">
      <header class="qt-header">
        <div class="qt-brand">
          <span class="qt-brand-icon" aria-hidden="true">文A</span>
          <div>
            <h1>Quick Translate</h1>
            <p>Select text, translate instantly</p>
          </div>
        </div>
        <span id="all-sites-chip" class="qt-chip" hidden>All sites</span>
      </header>

      <section class="qt-card">
        <div class="qt-row">
          <span class="qt-label">Current site</span>
          <strong id="origin" class="qt-origin">Unsupported page</strong>
        </div>
        <span id="site-state" class="qt-chip">Not enabled</span>
      </section>

      <section class="qt-card">
        <label class="qt-label" for="language">Translate into</label>
        <select id="language" class="qt-select">
          <option value="en">English</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="zh-TW">Chinese (Traditional)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
        <div id="advanced" class="hub-column"></div>
        <p id="status" class="qt-status"></p>
      </section>

      <section class="qt-card">
        <h2>Page access</h2>
        <div class="qt-actions">
          <button id="activate" class="qt-button qt-button--primary">
            <span>Enable this tab</span>
            <small>activeTab</small>
          </button>
          <button id="enable-site" class="qt-button qt-button--secondary" hidden>
            <span>Enable this site</span>
            <small>asks once</small>
          </button>
          <button id="disable-site" class="qt-button qt-button--ghost" hidden>
            <span>Disable this site</span>
            <small>exception</small>
          </button>
          <button id="enable-all" class="qt-button qt-button--secondary" hidden>
            <span>Enable all sites</span>
            <small>asks once</small>
          </button>
          <button id="disable-all" class="qt-button qt-button--danger" hidden>
            <span>Disable all sites</span>
            <small>revoke</small>
          </button>
        </div>
        <p class="qt-note">
          Permissions are requested only after you click. You can revoke access any time.
        </p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
