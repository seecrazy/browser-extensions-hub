<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Translate</title>
  </head>
  <body>
    <main class="qt-shell">
      <header class="qt-header">
        <div class="qt-brand">
          <span class="qt-brand-icon" aria-hidden="true">文A</span>
          <div>
            <h1>Quick Translate</h1>
            <p>Select text, translate instantly</p>
          </div>
        </div>
      </header>

      <section class="qt-card qt-base">
        <div class="qt-row">
          <span class="qt-label">Current site</span>
          <strong id="origin" class="qt-origin">Unsupported page</strong>
        </div>
        <span id="site-state" class="qt-chip">Not enabled</span>
        <button id="site-toggle" class="qt-button qt-button--primary" hidden>
          <span id="site-toggle-label">Enable on this site</span>
          <small id="site-toggle-note">asks once</small>
        </button>
      </section>

      <details id="advanced" class="qt-advanced-card">
        <summary class="qt-advanced-summary">
          <span class="qt-advanced-title">Advanced settings</span>
          <span class="qt-advanced-subtitle">Language · Timeout · Access</span>
          <span class="qt-advanced-chevron" aria-hidden="true">+</span>
        </summary>
        <div class="hub-advanced-content">
          <section>
            <label class="qt-label" for="language">Translate into</label>
            <select id="language" class="hub-select">
              <option value="en">English</option>
              <option value="zh-CN">Chinese (Simplified)</option>
              <option value="zh-TW">Chinese (Traditional)</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
            <label class="qt-label" for="timeout">Request timeout</label>
            <select id="timeout" class="hub-select">
              <option value="2000">2 seconds</option>
              <option value="6000">6 seconds</option>
              <option value="10000">10 seconds</option>
              <option value="15000">15 seconds</option>
              <option value="20000">20 seconds</option>
            </select>
          </section>

          <section>
            <h2>Temporary access</h2>
            <button id="activate" class="qt-button qt-button--secondary">
              <span>Enable this tab</span>
              <small>activeTab · expires on navigation</small>
            </button>
          </section>

          <section>
            <h2>All sites</h2>
            <button id="enable-all" class="qt-button qt-button--secondary" hidden>
              <span>Enable all sites</span>
              <small>asks once</small>
            </button>
            <button id="disable-all" class="qt-button qt-button--danger" hidden>
              <span>Disable all sites</span>
              <small>revoke access</small>
            </button>
          </section>
        </div>
      </details>

      <p id="status" class="qt-status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
