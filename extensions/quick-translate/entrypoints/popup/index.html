<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Translate</title>
  </head>
  <body>
    <main class="hub-page">
      <h1 class="hub-title">Quick Translate</h1>
      <div class="hub-card">
        <label class="hub-label" for="language">Translate selected text to</label>
        <select id="language" class="hub-select">
          <option value="en">English</option>
          <option value="zh-CN">Chinese (Simplified)</option>
          <option value="zh-TW">Chinese (Traditional)</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
        <p id="status" class="hub-status"></p>
      </div>
      <button id="activate" class="hub-button">Enable on this tab</button>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
