<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volume Booster Lite</title>
  </head>
  <body>
    <main class="hub-page">
      <h1 class="hub-title">Volume Booster Lite</h1>
      <div class="hub-card">
        <label class="hub-label" for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="300" step="5" />
        <p id="value">100%</p>
        <p id="status" class="hub-status"></p>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
