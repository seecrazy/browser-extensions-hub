<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Lite</title>
  </head>
  <body>
    <main class="hub-page">
      <h1 class="hub-title">Dark Mode Lite</h1>
      <div class="hub-card">
        <p id="site" class="hub-label">Current site</p>
        <div class="hub-row">
          <input id="enabled" type="checkbox" />
          <span>Enable dark mode</span>
        </div>
        <label class="hub-label" for="strength">Strength</label>
        <input id="strength" type="range" min="0" max="100" step="5" />
        <p id="status" class="hub-status"></p>
      </div>
      <p class="hub-label">Page reloads require reopening this popup.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
