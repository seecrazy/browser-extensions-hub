<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Stash</title>
  </head>
  <body>
    <main class="hub-page">
      <h1 class="hub-title">Tab Stash</h1>
      <div class="hub-card">
        <label class="hub-label" for="group-name">Group name</label>
        <input id="group-name" class="hub-input" placeholder="Optional name" />
        <button id="stash" class="hub-button">Stash all tabs</button>
        <p id="status" class="hub-status"></p>
      </div>
      <div class="hub-card">
        <label class="hub-label" for="search">Search</label>
        <input id="search" class="hub-input" placeholder="Search tabs" />
      </div>
      <div id="groups"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
