name: Release extension

on:
  push:
    tags:
      - "*@*"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        id: tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pnpm validate:release-tag "$TAG_NAME"
          plugin="${TAG_NAME%@*}"
          version="${TAG_NAME#*@}"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome
        run: pnpm --filter "@hub/${{ needs.validate.outputs.plugin }}" build:chrome

      - name: Build Firefox
        run: pnpm --filter "@hub/${{ needs.validate.outputs.plugin }}" build:firefox

      - name: Pack Chrome artifact
        run: |
          plugin="${{ needs.validate.outputs.plugin }}"
          version="${{ needs.validate.outputs.version }}"
          mkdir -p release
          (cd "extensions/${plugin}/.output/chrome-mv3" && zip -r "../../../release/${plugin}-${version}-chrome-mv3.zip" .)

      - name: Pack Firefox artifact
        run: |
          plugin="${{ needs.validate.outputs.plugin }}"
          version="${{ needs.validate.outputs.version }}"
          mkdir -p release
          (cd "extensions/${plugin}/.output/firefox-mv3" && zip -r "../../../release/${plugin}-${version}-firefox-mv3.xpi" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/

  publish-chrome:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Chrome extension id
        id: chrome
        env:
          PLUGIN: ${{ needs.validate.outputs.plugin }}
          DARK_MODE_LITE_CHROME_EXTENSION_ID: ${{ secrets.DARK_MODE_LITE_CHROME_EXTENSION_ID }}
          TAB_STASH_CHROME_EXTENSION_ID: ${{ secrets.TAB_STASH_CHROME_EXTENSION_ID }}
          VOLUME_BOOSTER_CHROME_EXTENSION_ID: ${{ secrets.VOLUME_BOOSTER_CHROME_EXTENSION_ID }}
          QUICK_TRANSLATE_CHROME_EXTENSION_ID: ${{ secrets.QUICK_TRANSLATE_CHROME_EXTENSION_ID }}
          FOCUS_LOCK_CHROME_EXTENSION_ID: ${{ secrets.FOCUS_LOCK_CHROME_EXTENSION_ID }}
        run: |
          plugin="${PLUGIN^^}"
          plugin="${plugin//-/_}"
          id="${plugin}_CHROME_EXTENSION_ID"
          value="${!id}"
          if [ -z "$value" ]; then
            echo "::warning::Chrome extension id secret is missing; skipping Chrome upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "extension_id=$value" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Chrome draft
        if: steps.chrome.outputs.skip == 'false'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ steps.chrome.outputs.extension_id }}
          PLUGIN: ${{ needs.validate.outputs.plugin }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npx --yes chrome-webstore-upload-cli upload \
            --source "release/${PLUGIN}-${VERSION}-chrome-mv3.zip" \
            --no-auto-publish

  publish-firefox:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sign and publish Firefox extension
        if: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          PLUGIN: ${{ needs.validate.outputs.plugin }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npx --yes web-ext sign \
            --source-dir "extensions/${PLUGIN}/.output/firefox-mv3" \
            --artifacts-dir release \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
      - publish-chrome
      - publish-firefox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
