name: Release extension

on:
  push:
    tags:
      - "*@*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plugin: ${{ steps.tag.outputs.plugin }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        id: tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          pnpm validate:release-tag "$TAG_NAME"
          plugin="${TAG_NAME%@*}"
          version="${TAG_NAME#*@}"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    env:
      PLUGIN: ${{ needs.validate.outputs.plugin }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome
        run: pnpm --filter "@hub/${PLUGIN}" build:chrome

      - name: Build Firefox
        run: pnpm --filter "@hub/${PLUGIN}" build:firefox

      - name: Validate built manifests
        run: |
          node --experimental-strip-types scripts/validate-manifests.ts --plugin "$PLUGIN" --browser chrome
          node --experimental-strip-types scripts/validate-manifests.ts --plugin "$PLUGIN" --browser firefox

      - name: Lint Firefox build
        run: pnpm exec web-ext lint --source-dir "extensions//dist/firefox-mv3"

      - name: Pack Chrome artifact
        run: |
          mkdir -p release
          (cd "extensions//dist/chrome-mv3" && zip -r "../../../release/${PLUGIN}-${VERSION}-chrome-mv3.zip" .)

      - name: Pack Firefox artifact
        run: |
          (cd "extensions//dist/firefox-mv3" && zip -r "../../../release/${PLUGIN}-${VERSION}-firefox-mv3.zip" .)

      - name: Pack Firefox source artifact
        run: |
          git archive --format=zip \
            --output "release/${PLUGIN}-${VERSION}-firefox-source.zip" \
            HEAD \
            "extensions/${PLUGIN}" \
            packages/shared \
            packages/tsconfig \
            packages/eslint-config \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            package.json \
            tsconfig.base.json

      - name: Generate checksums and smoke check
        run: |
          test -f "release/${PLUGIN}-${VERSION}-chrome-mv3.zip"
          test -f "release/${PLUGIN}-${VERSION}-firefox-mv3.zip"
          test -f "release/${PLUGIN}-${VERSION}-firefox-source.zip"
          cd release
          sha256sum * > SHA256SUMS
          test -f SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/

  publish-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-publish
    needs:
      - validate
      - build
    env:
      PLUGIN: ${{ needs.validate.outputs.plugin }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/

      - name: Resolve Chrome extension id
        id: chrome
        env:
          DARK_MODE_LITE_CHROME_EXTENSION_ID: ${{ secrets.DARK_MODE_LITE_CHROME_EXTENSION_ID }}
          TAB_STASH_CHROME_EXTENSION_ID: ${{ secrets.TAB_STASH_CHROME_EXTENSION_ID }}
          VOLUME_BOOSTER_CHROME_EXTENSION_ID: ${{ secrets.VOLUME_BOOSTER_CHROME_EXTENSION_ID }}
          QUICK_TRANSLATE_CHROME_EXTENSION_ID: ${{ secrets.QUICK_TRANSLATE_CHROME_EXTENSION_ID }}
          FOCUS_LOCK_CHROME_EXTENSION_ID: ${{ secrets.FOCUS_LOCK_CHROME_EXTENSION_ID }}
        run: |
          plugin="${PLUGIN^^}"
          plugin="${plugin//-/_}"
          id="${plugin}_CHROME_EXTENSION_ID"
          value="${!id}"
          if [ -z "$value" ]; then
            echo "::warning::Chrome extension id secret is missing; skipping Chrome upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "extension_id=$value" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Chrome draft
        if: steps.chrome.outputs.skip == 'false'
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ steps.chrome.outputs.extension_id }}
        run: |
          pnpm exec chrome-webstore-upload-cli upload \
            --source "release/${PLUGIN}-${VERSION}-chrome-mv3.zip" \
            --no-auto-publish

  publish-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firefox-publish
    needs:
      - validate
      - build
    outputs:
      signed: ${{ steps.amo.outputs.signed }}
    env:
      PLUGIN: ${{ needs.validate.outputs.plugin }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/

      - name: Unpack Firefox artifact
        run: |
          rm -rf staging/firefox-mv3
          mkdir -p staging/firefox-mv3
          unzip -q "release/${PLUGIN}-${VERSION}-firefox-mv3.zip" -d staging/firefox-mv3

      - name: Resolve AMO credentials
        id: amo
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO credentials are missing; skipping Firefox signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and publish Firefox extension
        if: steps.amo.outputs.signed == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm exec web-ext sign \
            --source-dir staging/firefox-mv3 \
            --artifacts-dir release/signed \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

          signed_xpi="$(find release/signed -maxdepth 1 -type f -name '*.xpi' | head -1)"
          test -n "$signed_xpi"
          cp "$signed_xpi" "release/${PLUGIN}-${VERSION}-firefox-mv3-signed.xpi"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        if: steps.amo.outputs.signed == 'true'
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}-signed
          path: release/${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}-firefox-mv3-signed.xpi

  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate
      - build
      - publish-chrome
      - publish-firefox
    permissions:
      contents: write
    env:
      PLUGIN: ${{ needs.validate.outputs.plugin }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}
          path: release/build/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        if: needs.publish-firefox.outputs.signed == 'true'
        with:
          name: extension-${{ needs.validate.outputs.plugin }}-${{ needs.validate.outputs.version }}-signed
          path: release/signed/

      - name: Prepare release assets
        run: |
          mkdir -p release/assets
          cp release/build/* release/assets/

          if [ -f "release/signed/${PLUGIN}-${VERSION}-firefox-mv3-signed.xpi" ]; then
            rm "release/assets/${PLUGIN}-${VERSION}-firefox-mv3.zip"
            cp "release/signed/${PLUGIN}-${VERSION}-firefox-mv3-signed.xpi" \
              "release/assets/${PLUGIN}-${VERSION}-firefox-mv3-signed.xpi"
          fi

          cd release/assets
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          files: release/assets/*
          generate_release_notes: true
